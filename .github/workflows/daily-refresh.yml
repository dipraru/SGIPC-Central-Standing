name: Daily Database Refresh

on:
  schedule:
    # Primary run at 18:00 UTC (12:00 AM Bangladesh)
    - cron: '0 18 * * *'
    # Fallback run 10 minutes later for GitHub schedule delays
    - cron: '10 18 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  refresh-standings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: daily-refresh-standings
      cancel-in-progress: false
    steps:
      - name: Refresh all chunks with retries
        env:
          BASE_URL: https://sgipc-central-standing.vercel.app
          CRON_SECRET: 8%7DN5%21eH%24D%26ss%2CqV%5DR99f%29Xs2S0pKM304
        run: |
          set -e
          skip=0
          while true; do
            url="$BASE_URL/api/cron/refresh-chunk?secret=$CRON_SECRET&skip=$skip&limit=5"
            echo "Refreshing chunk: skip=$skip"
            ok=0
            response=""
            for attempt in 1 2 3; do
              if response=$(curl -fsS --max-time 55 "$url"); then
                ok=1
                break
              fi
              echo "Attempt $attempt failed for skip=$skip; retrying in 10s..."
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "Chunk refresh failed after retries: skip=$skip"
              exit 1
            fi

            echo "$response"

            processed_count=$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const obj=JSON.parse(s||"{}");console.log((obj.processed||[]).length);});')
            next_skip=$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const obj=JSON.parse(s||"{}");console.log(Number.isFinite(obj.nextSkip)?obj.nextSkip:0);});')

            if [ "$processed_count" -eq 0 ]; then
              echo "All handles refreshed."
              break
            fi

            skip=$next_skip
            sleep 20
          done
